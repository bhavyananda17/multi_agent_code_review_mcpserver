name: Build, Test, and Deploy McpServer to AWS

on:
  push:
    branches: [main]
    paths:
      - 'MultiAgentCodeReview.McpServer/**'
      - 'MultiAgentCodeReview.Core/**'
      - 'MultiAgentCodeReview.Orchestration/**'
      - 'MultiAgentCodeReview.Agents/**'
      - '.github/workflows/deploy-mcp-aws.yml'

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: multiagent-mcp-server
  INSTANCE_ID: i-0b0513a0a7d478c2c

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # CI gate: no test project exists in this repo yet, so a clean build
      # is the bar a change must clear before it's allowed to deploy.
      - name: Restore & build
        run: dotnet build MultiAgentCodeReview.slnx -c Release

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f MultiAgentCodeReview.McpServer/Dockerfile \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy via SSM
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY\",\"/opt/multiagent-mcp/run-container.sh $IMAGE_URI\"]" \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' --output text)
          echo "Deploy command: $COMMAND_ID"

          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "SSM command status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy failed:"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query 'StandardErrorContent' --output text
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deploy"
          exit 1
